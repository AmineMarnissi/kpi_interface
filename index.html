<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEL-T Factory Meeting Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js?v=2026-10-14-22"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css?v=2026-10-14-14" />
</head>

<body class="bg-[#f0f4ff] dark:bg-[#03050f] text-slate-900 dark:text-slate-100 font-sans antialiased">
  <div id="toast-container" class="fixed right-5 bottom-5 z-[100] space-y-2"></div>

  <header
    class="sticky top-0 z-50 border-b border-slate-200 dark:border-[#1e2a4a] bg-white/90 dark:bg-gradient-to-r dark:from-[#02040f] via-[#050b1f] to-[#10042a] backdrop-blur-xl shadow-sm dark:shadow-[#02040f]/60">
    <div class="px-4 lg:px-6 py-3 flex flex-col gap-4">
      <!-- Ligne 1: Logos et Titre -->
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 min-w-0">
          <div class="flex items-center justify-center h-8 shrink-0">
            <img src="light_logo.png" alt="MEL-T Logo" class="h-full w-auto object-contain dark:hidden" />
            <img src="dark_logo.png" alt="MEL-T Logo" class="h-full w-auto object-contain hidden dark:block" />
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-[10px] uppercase tracking-[.18em] font-black text-[#2952ff] dark:text-[#93b8ff]">MEL-T
                Components &amp; Manufacturing</span>
              <span id="period-badge"
                class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-[#34d399] border border-emerald-500/20">Septembre 2026</span>
            </div>
            <h1 class="text-lg lg:text-xl font-black tracking-tight truncate dark:text-white">Factory Meeting Dashboard
            </h1>
          </div>
        </div>
        <img src="melt_logo.png" alt="MEL-T Icon"
          class="h-6 w-auto rounded border border-slate-200 dark:border-[#2d3f6e] shadow-sm object-contain hidden sm:block" />
      </div>

      <!-- Ligne 2: Boutons -->
      <div id="top-actions"
        class="flex flex-wrap items-center justify-center gap-2 border-t border-slate-200/50 dark:border-[#1e2a4a] pt-3">
        <!-- Language Switcher 4 boutons -->
        <div
          class="flex items-center gap-1 p-1 rounded-xl bg-slate-100 dark:bg-[#ffffff]/4 border border-slate-200 dark:border-[#2d3f6e]/50">
          <button onclick="setMatrixLang('ar')" id="lang-btn-ar"
            class="lang-btn px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-[#1432e0]/30"
            title="العربية">🇹🇳 AR</button>
          <button onclick="setMatrixLang('fr')" id="lang-btn-fr"
            class="lang-btn px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#2952ff] text-white shadow"
            title="Français">🇫🇷 FR</button>
          <button onclick="setMatrixLang('it_en')" id="lang-btn-it"
            class="lang-btn px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-[#1432e0]/30"
            title="Italiano">🇮🇹 IT</button>
          <button onclick="setMatrixLang('en')" id="lang-btn-en"
            class="lang-btn px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-[#1432e0]/30"
            title="English">🇬🇧 EN</button>
        </div>
        <button id="theme-toggle"
          class="p-2.5 rounded-xl border border-slate-200 dark:border-[#2d3f6e]/50 bg-slate-100 dark:bg-[#ffffff]/4 dark:text-[#b9cdff] hover:dark:bg-indigo-800/40 transition-all"
          title="Changer le thème"><i data-lucide="sun" class="w-4 h-4"></i></button>
        <button id="print-btn"
          class="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-[#2d3f6e]/50 bg-white dark:bg-[#ffffff]/4 dark:text-[#b9cdff] text-xs font-bold flex items-center gap-2 hover:dark:bg-indigo-800/40 transition-all"><i
            data-lucide="printer" class="w-4 h-4"></i><span id="hdr-print">Imprimer</span></button>
      </div>
    </div>
  </header>


  <div class="flex min-h-[calc(100vh-69px)]">
    <aside
      class="hidden lg:flex w-72 shrink-0 sticky top-[128px] h-[calc(100vh-128px)] border-r border-slate-200/60 dark:border-[#1e2a4a] bg-white dark:bg-[#080c1a] flex-col p-4 overflow-y-auto">
      <nav id="sidebar-nav" class="space-y-1.5"></nav>
      <div class="mt-auto pt-6">
        <div class="rounded-2xl border border-slate-200/70 dark:border-[#1e2a4a] bg-slate-50 dark:bg-[#06081a] p-4">
          <div id="side-data-quality"
            class="flex items-center gap-2 text-xs font-black text-[#2952ff] dark:text-[#7aa3ff]"><i
              data-lucide="database" class="w-4 h-4"></i>Qualité des données</div>
          <div class="mt-3 space-y-2 text-[11px]">
            <div class="flex justify-between"><span id="side-loaded-label" class="text-slate-500">KPI
                alimentés</span><strong id="side-loaded">0</strong></div>
            <div class="flex justify-between"><span id="side-missing-label" class="text-slate-500">KPI N/A</span><strong
                id="side-missing">0</strong></div>
            <div class="flex justify-between"><span id="side-source-label" class="text-slate-500">Source</span><strong
                id="side-source" class="truncate max-w-[125px]">Aucune</strong></div>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 min-w-0 overflow-x-hidden p-4 lg:p-6 space-y-5 bg-[#f0f4ff] dark:bg-transparent">
      <div class="lg:hidden overflow-x-auto scrollbar-hidden -mx-4 px-4">
        <div id="mobile-nav" class="flex gap-2 min-w-max pb-1"></div>
      </div>



      <section id="filter-bar"
        class="rounded-2xl border border-slate-200/70 dark:border-[#1e2a4a] bg-white dark:bg-[#0d1326] p-4 shadow-sm">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
          <label id="filter-period-label" class="text-xs font-bold text-slate-500">Période principale
            <select id="period-filter"
              class="mt-1.5 w-full rounded-xl border border-slate-200/70 dark:border-[#1e2a4a] bg-slate-50 dark:bg-[#06081a] px-3 py-2.5 text-sm text-slate-800 dark:text-slate-100"></select>
          </label>
          <label id="filter-compare-label" class="text-xs font-bold text-slate-500">Comparaison
            <select id="compare-filter"
              class="mt-1.5 w-full rounded-xl border border-slate-200/70 dark:border-[#1e2a4a] bg-slate-50 dark:bg-[#06081a] px-3 py-2.5 text-sm text-slate-800 dark:text-slate-100"></select>
          </label>
          <label id="filter-status-label" class="text-xs font-bold text-slate-500">Statut
            <select id="status-filter"
              class="mt-1.5 w-full rounded-xl border border-slate-200/70 dark:border-[#1e2a4a] bg-slate-50 dark:bg-[#06081a] px-3 py-2.5 text-sm text-slate-800 dark:text-slate-100"></select>
          </label>
          <label id="filter-search-label" class="text-xs font-bold text-slate-500">Recherche KPI
            <div class="relative mt-1.5"><i data-lucide="search"
                class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i><input id="kpi-search"
                placeholder="Nom, définition..."
                class="w-full rounded-xl border border-slate-200/70 dark:border-[#1e2a4a] bg-slate-50 dark:bg-[#06081a] pl-9 pr-3 py-2.5 text-sm" />
            </div>
          </label>
        </div>
      </section>

      <section id="page-content" class="space-y-6"></section>
    </main>
  </div>

  <footer
    class="border-t border-slate-200/70 dark:border-[#1e2a4a] bg-white dark:bg-[#0d1326] px-6 py-4 text-[11px] text-slate-500 flex flex-col md:flex-row gap-2 justify-between">
    <span id="footer-credits">© 2026 MEL-T Components & Manufacturing — Factory Meeting Dashboard</span>
    <span id="footer-stack">HTML/JavaScript pur · Chart.js · Données statiques intégrées</span>
  </footer>

  <dialog id="detail-modal"
    class="backdrop:bg-slate-950/70 rounded-3xl p-0 w-[min(1100px,94vw)] h-[min(92vh,980px)] max-h-[92vh] overflow-hidden bg-white dark:bg-[#0d1326] text-slate-900 dark:text-slate-100 border border-slate-200/70 dark:border-[#1e2a4a] shadow-2xl">
    <div
      class="sticky top-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200/70 dark:border-[#1e2a4a] p-5 flex justify-between items-center z-10">
      <div>
        <div id="modal-eyebrow"
          class="text-[10px] uppercase tracking-widest text-[#2952ff] dark:text-[#7aa3ff] font-black"></div>
        <h2 id="modal-title" class="text-xl font-black"></h2>
      </div>
      <button onclick="document.getElementById('detail-modal').close()"
        class="p-2 rounded-xl bg-slate-100 dark:bg-[#0f1729]"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="modal-body" class="min-h-0 flex-1 p-5 overflow-auto overscroll-contain"></div>
  </dialog>
  </body>

</html>
