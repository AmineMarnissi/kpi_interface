<title>Hoshin Kanri — Tableau PVT hiérarchique</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d8e0ec;--blue:#2457d6;--blue2:#eaf0ff;--green:#157347;--shadow:0 8px 28px rgba(30,50,90,.08)}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;box-shadow:0 2px 12px rgba(20,40,80,.05)}
.header-row{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap} h1{margin:0;font-size:24px;color:#214fae} .sub{color:var(--muted);font-size:13px;margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center} select,input,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff} input{min-width:280px} button{cursor:pointer;font-weight:700;color:#214fae} button.primary{background:var(--blue);color:white;border-color:var(--blue)}
main{max-width:1500px;margin:auto;padding:24px} .stats{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px;margin-bottom:18px} .stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--shadow)} .stat b{font-size:22px;display:block;color:#214fae} .stat span{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden} .panel-head{padding:14px 18px;background:#f9fbff;border-bottom:1px solid var(--line);font-weight:800;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tree{padding:8px 14px 18px} details{margin:5px 0} summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;border-radius:9px;padding:9px 10px} summary::-webkit-details-marker{display:none} summary:hover{background:#f4f7ff}
.toggle{width:22px;height:22px;border-radius:6px;background:var(--blue2);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 22px} details[open]>summary>.toggle::before{content:'−'} details:not([open])>summary>.toggle::before{content:'+'}
.level-process>summary{font-size:17px;font-weight:900;background:#edf3ff;border-left:5px solid var(--blue)} .level-axis>summary{font-weight:800;background:#f7f9fd} .level-objective>summary{font-weight:700} .level-initiative>summary{font-weight:650;color:#2e4268} .level-owner>summary{font-weight:650;color:#0f6b43}
.children{margin-left:22px;padding-left:13px;border-left:1px dashed #c8d2e3} .badge{font-size:11px;background:#eef2f8;color:#536078;border-radius:999px;padding:3px 7px;margin-left:auto;white-space:nowrap} .pilot{font-size:12px;color:#0f6b43;background:#e7f7ef;border-radius:999px;padding:4px 8px}
.kpis{margin:5px 0 8px 31px;display:grid;gap:5px} .kpi{padding:8px 10px;border:1px solid #dce5f2;border-radius:8px;background:#fff;display:flex;gap:8px;align-items:flex-start} .kcode{font-weight:800;color:#214fae;min-width:34px}
.empty{padding:28px;text-align:center;color:var(--muted)} mark{background:#fff2a8}
.legend{font-size:12px;color:var(--muted)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)} input{min-width:180px;width:100%} main{padding:12px} .children{margin-left:10px;padding-left:8px}}
@media print{header,.controls{display:none!important}body{background:#fff}main{max-width:none;padding:0}.panel,.stat{box-shadow:none}details{display:block}details>div{display:block!important}}
</style></head>

const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function codeOf(s){const m=String(s).match(/^([A-Z]+\d+)\s*-/);return m?m[1]:''}
function countData(d){let axes=new Set(),objs=new Set(),inis=new Set(),kpis=new Set(),links=0;Object.values(d).forEach(p=>Object.entries(p.axes).forEach(([a,av])=>{axes.add(a);Object.entries(av.objectives).forEach(([o,ov])=>{objs.add(o);Object.entries(ov.initiatives).forEach(([i,iv])=>{inis.add(i);Object.values(iv.owners).forEach(list=>list.forEach(k=>{kpis.add(k);links++}))})})}));return{processes:Object.keys(d).length,axes:axes.size,objectives:objs.size,initiatives:inis.size,kpis:kpis.size,links}}
function renderStats(d){const c=countData(d);$('#stats').innerHTML=[['Processus',c.processes],['Axes',c.axes],['Objectifs',c.objectives],['Initiatives',c.initiatives],['KPI distincts',c.kpis]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
function node(cls,label,count,children,extra=''){return `<details class="${cls}"><summary><span class="toggle"></span><span>${label}</span>${extra}<span class="badge">${count}</span></summary><div class="children">${children}</div></details>`}
function render(){const pf=$('#processFilter').value,q=$('#search').value.trim().toLowerCase();let filtered={};Object.entries(DATA).forEach(([pn,p])=>{if(pf!=='ALL'&&pn!==pf)return; filtered[pn]=p});renderStats(filtered);let out='';
Object.entries(filtered).forEach(([pn,p])=>{let axesHtml='';Object.entries(p.axes).forEach(([an,a])=>{let objsHtml='';Object.entries(a.objectives).forEach(([on,o])=>{let inisHtml='';Object.entries(o.initiatives).forEach(([iin,i])=>{let ownersHtml='';Object.entries(i.owners).forEach(([owner,kpis])=>{let khtml=kpis.map(k=>`<div class="kpi"><span class="kcode">${esc(codeOf(k))}</span><span>${esc(k)}</span></div>`).join(''); ownersHtml+=node('level-owner',esc(owner),kpis.length,`<div class="kpis">${khtml}</div>`);});inisHtml+=node('level-initiative',esc(iin),Object.values(i.owners).reduce((s,x)=>s+x.length,0),ownersHtml)});objsHtml+=node('level-objective',esc(on),Object.keys(o.initiatives).length,inisHtml)});axesHtml+=node('level-axis',esc(an),Object.keys(a.objectives).length,objsHtml)});out+=node('level-process',esc(pn),Object.keys(p.axes).length,axesHtml,`<span class="pilot">Pilote : ${esc(p.pilote)}</span>`)});
$('#tree').innerHTML=out||'<div class="empty">Aucun résultat.</div>'; if(q) filterTree(q);}
function filterTree(q){document.querySelectorAll('#tree details').forEach(d=>d.dataset.match='0');document.querySelectorAll('#tree summary').forEach(s=>{if(s.innerText.toLowerCase().includes(q)){let d=s.parentElement;while(d&&d.matches('details')){d.dataset.match='1';d.open=true;d=d.parentElement.closest('details')}}});document.querySelectorAll('#tree details').forEach(d=>{if(d.dataset.match!=='1')d.style.display='none'})}
